<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · GST Bazarr</title>
  <!-- Self-contained on purpose: /login and POST /api/auth/login are the only requests served without a session,
       so this page must not pull in any other file (no CDN, no /styles.css). -->
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7; --surface: #fff; --border: #c9ced6; --text: #15181c; --muted: #6a737e;
      --accent: #0f8f5f; --accent-hover: #0b7a50; --on-accent: #fff;
      --danger: #c2372d; --danger-soft: #fbe8e6; --focus: #2c6bd0;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1114; --surface: #161a1f; --border: #37404a; --text: #e7ebef; --muted: #8a949f;
        --accent: #3cc98b; --accent-hover: #5dd6a2; --on-accent: #06140c;
        --danger: #f27a70; --danger-soft: #3a1b19; --focus: #6ea6ff;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e1114; --surface: #161a1f; --border: #37404a; --text: #e7ebef; --muted: #8a949f;
      --accent: #3cc98b; --accent-hover: #5dd6a2; --on-accent: #06140c;
      --danger: #f27a70; --danger-soft: #3a1b19; --focus: #6ea6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      background: var(--bg); color: var(--text); font: 15px/1.5 var(--font);
    }
    main {
      width: 100%; max-width: 22rem; padding: 1.75rem 1.5rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
    p.sub { margin: 0 0 1.25rem; color: var(--muted); font-size: .875rem; }
    label { display: block; margin: 0 0 1rem; font-size: .875rem; font-weight: 600; }
    input {
      display: block; width: 100%; margin-top: .3rem; padding: .6rem .7rem; font: inherit; font-weight: 400;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button {
      width: 100%; padding: .65rem; font: inherit; font-weight: 600; cursor: pointer;
      color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: progress; }
    #error {
      margin: 0 0 1rem; padding: .55rem .7rem; font-size: .875rem; color: var(--danger);
      background: var(--danger-soft); border-radius: 8px;
    }
  </style>
  <script>
    try {
      const theme = localStorage.getItem("gst-theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <main>
    <h1>GST Bazarr</h1>
    <p class="sub">Sign in to the translator console</p>
    <form id="login" method="post" action="/api/auth/login">
      <p id="error" role="alert" hidden></p>
      <label>User name
        <input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const form = document.getElementById("login");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      error.hidden = true;
      button.disabled = true;
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: form.user.value, password: form.password.value }),
        });
        if (response.ok) {
          location.replace("/");
          return;
        }
        let message = `Sign-in failed (${response.status})`;
        try { message = (await response.json()).error || message; } catch {}
        error.textContent = message;
      } catch {
        error.textContent = "Cannot reach the server";
      }
      error.hidden = false;
      form.password.value = "";
      form.password.focus();
      button.disabled = false;
    });
  </script>
</body>
</html>
