[project]
name = "llm-subtitle-server"
version = "0.0.0"
description = "Subtitle translation server: HTTP API and console, queue, Bazarr catalog, and translation runtime"
requires-python = ">=3.12,<3.15"
dependencies = [
    "subcore",
]

[tool.uv]
# Runs as a script (worker.py) next to the subserver package; not built or installed.
package = false

[tool.uv.sources]
subcore = { workspace = true }
