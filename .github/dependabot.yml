version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    allow:
      - dependency-name: google-genai
        dependency-type: direct
    open-pull-requests-limit: 1
    assignees:
      - tamvcspk
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      mantine:
        patterns:
          - "@mantine/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    assignees:
      - tamvcspk
    commit-message:
      prefix: deps
