name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --no-dev --all-packages

      - name: Run worker tests
        run: uv run --locked python -m unittest discover -s apps/server/tests -t apps/server -v

      - name: Run subcore tests
        run: uv run --locked python -m unittest discover -s packages/subcore/tests -t packages/subcore -v

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q -f apps/server/worker.py apps/server/subserver packages/subcore/src

      - name: Check subcore CLI
        run: uv run --locked subcore --help

  web:
    name: Web (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
