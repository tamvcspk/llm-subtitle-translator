name: gemini-srt-translator-bazarr

services:
  gemini-srt-translator-bazarr:
    build:
      context: .
      args:
        INSTALL_FFMPEG: ${INSTALL_FFMPEG:-false}
    image: ${GST_BAZARR_IMAGE:-ghcr.io/tamvcspk/llm-subtitle-translator:latest}
    container_name: gemini-srt-translator-bazarr
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "Gemini SRT Translator for Bazarr"
      org.opencontainers.image.description: "A Bazarr companion app that translates configured source subtitles with an in-process LLM engine (subcore)."
      org.opencontainers.image.licenses: "MIT"
    env_file:
      - path: .env
        required: false
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY1: ${GEMINI_API_KEY1:-}
      GEMINI_API_KEY2: ${GEMINI_API_KEY2:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      CONSOLE_USER: ${CONSOLE_USER:-}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-}
      CONSOLE_PASSWORD_RESET: ${CONSOLE_PASSWORD_RESET:-}
      CONSOLE_AUTH: ${CONSOLE_AUTH:-}
      CONSOLE_COOKIE_SAMESITE: ${CONSOLE_COOKIE_SAMESITE:-}
      BAZARR_URL: ${BAZARR_URL:-http://bazarr:6767}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      GST_MODEL: ${GST_MODEL:-gemini-3.1-flash-lite}
      GST_ONLY_PATHS: ${GST_ONLY_PATHS:-}
      LLM_RPM: ${LLM_RPM:-}
      LLM_TPM: ${LLM_TPM:-}
      LLM_RPD: ${LLM_RPD:-}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
      GST_TARGET_LANGUAGE: ${GST_TARGET_LANGUAGE:-Vietnamese}
      WORKER_SLEEP_SECONDS: ${WORKER_SLEEP_SECONDS:-15}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      BAZARR_CONFIG_PATH: /bazarr-config/config.yaml
      QUEUE_DIR: /queue
      STATE_DIR: /state
      LOG_DIR: /state/logs
      APP_CONFIG_PATH: /state/config.json
      TMDB_CACHE_PATH: /state/cache/tmdb_cache.json
      WEB_HOST: 0.0.0.0
      WEB_PORT: 6789
    ports:
      - 6789:6789
    volumes:
      - ${MEDIA_ROOT:-/mnt/data}:/media
      - ${BAZARR_CONFIG_DIR:-/opt/docker/bazarr/config}:/bazarr-config:ro
      - ${WORKER_STATE_DIR:-/opt/docker/gemini-srt-translator-bazarr}:/state
      # Only to settle an older queue into the database once, at the first start after the upgrade (docs/BAZARR.md).
      # Bazarr's post-processing script is gone: once the folders have moved to queue.migrated/, this line can go too.
      - ${BAZARR_POSTPROCESS_DIR:-/opt/docker/bazarr/postprocess}/queue:/queue
